name: self-check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Extract packaged source
        run: python tools/unpack_skill.py --output unpacked
      - name: Install dependencies
        run: python -m pip install -r unpacked/scripts/requirements.txt
      - name: Compile
        run: python -m compileall -q unpacked/scripts
      - name: Run self-check
        run: python unpacked/scripts/self_check.py
